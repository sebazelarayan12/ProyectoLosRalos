server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # mime.types de nginx no incluye .mjs -> caia a application/octet-stream y,
    # con nosniff, el navegador rechazaba ejecutar el worker de pdfjs (modulo ES).
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; script-src 'self'; frame-src 'self' blob:; object-src 'self' blob:;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        # Mantener alineado con RequestSizeLimit(32MB) del endpoint de lote y con
        # Storage:MaxLoteFileSizeBytes (30 MB) en appsettings.json — este valor debe ser
        # el mayor de los tres para que el 400 lo devuelva la API y no un 413 de nginx.
        client_max_body_size 32M;
        proxy_pass http://${API_INTERNAL_HOST}:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
