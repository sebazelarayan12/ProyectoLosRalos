server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # mime.types de nginx no incluye .mjs -> caia a application/octet-stream y,
    # con nosniff, el navegador rechazaba ejecutar el worker de pdfjs (modulo ES).
    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; script-src 'self'; frame-src 'self' blob:; object-src 'self' blob:;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # index.html referencia los assets hasheados por nombre (index-HASH.js) — sin
    # esto el navegador cachea index.html heuristicamente (via Last-Modified, sin
    # Cache-Control) y sigue sirviendo un HTML viejo que apunta a un bundle JS
    # viejo aunque el deploy ya haya publicado un bundle nuevo.
    # add_header no hereda del bloque server si el location define el suyo propio
    # -> hay que repetir los headers de seguridad de arriba en cada location nueva.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; script-src 'self'; frame-src 'self' blob:; object-src 'self' blob:;" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Vite hashea el nombre de archivo en /assets/ (index-HASH.js) — el contenido
    # de una URL con ese hash nunca cambia, se puede cachear indefinidamente.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; script-src 'self'; frame-src 'self' blob:; object-src 'self' blob:;" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location /api/ {
        # Mantener alineado con RequestSizeLimit(32MB) del endpoint de lote y con
        # Storage:MaxLoteFileSizeBytes (30 MB) en appsettings.json — este valor debe ser
        # el mayor de los tres para que el 400 lo devuelva la API y no un 413 de nginx.
        client_max_body_size 32M;
        proxy_pass http://${API_INTERNAL_HOST}:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
